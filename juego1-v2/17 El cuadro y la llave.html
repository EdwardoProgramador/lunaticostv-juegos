<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>17 El cuadro y la llave · Los objetos del Cholo</title>
<link rel="stylesheet" href="lib/cholo.css">
<script src="lib/vendor.js"></script>
<link rel="stylesheet" href="lib/reward-stage.css">
<link rel="stylesheet" href="lib/room.css">
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { roomPage, flyIcon, sparks } from './lib/room-page.js';
import { createRoom, PAINT, WALL_Z } from './lib/room.js';
import { createTray } from './lib/tray.js';
import { createAltarOrder } from './lib/altar-order.js';
import { createCrystal } from './lib/crystal.js';
import { crystalFX, PUZZLE_SCALE } from './lib/crystal-fx.js';
import { buildKey, renderIcon } from './lib/key.js';
import { TEXT, ALTAR_ORDER } from './lib/level2-text.js';

const P = roomPage({ page: '17' });
const room = createRoom({ stage: P.stage, canvas: P.canvas });
const keyIcon = renderIcon(buildKey(), 160);
const tray = createTray({ mount: P.ui, items: [{ key: 'key', name: TEXT.keyName, src: keyIcon, sil: keyIcon }], label: TEXT.inventoryLabel });
tray.slots.key.querySelector('.chud-sil').style.filter = 'brightness(0) opacity(.35)';
const order = createAltarOrder({ room, page: P, tray });
const crystal = createCrystal();
const FX = crystalFX(room);
const key = buildKey(); key.visible = false;
const keyHolder = new THREE.Group(); keyHolder.add(key); key.position.y = -0.42; room.niche.anchor.add(keyHolder);
const hit = document.createElement('button'); hit.className = 'room-zone'; hit.setAttribute('aria-label', TEXT.keyName); hit.style.cssText = 'display:none;width:130px;height:200px;margin:-100px 0 0 -65px;border-radius:40%'; P.ui.appendChild(hit);
const keyCenter = new THREE.Vector3();
let tl = null, canTake = false;
const GL = room.painting.glow;
function frameGlow() {
  const c = GL.ctx, W = GL.canvas.width, H = GL.canvas.height; c.clearRect(0, 0, W, H);
  c.save(); c.shadowColor = '#ff9a3c'; c.shadowBlur = 30; c.strokeStyle = '#ffc890'; c.lineWidth = 6; c.strokeRect(6, 6, W - 12, H - 12);
  const g = c.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, W * 0.7); g.addColorStop(0, 'rgba(255,170,90,.55)'); g.addColorStop(1, 'rgba(255,120,50,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.restore(); GL.tex.needsUpdate = true;
}
room.onTick(t => {
  keyHolder.rotation.y = Math.sin(t * 0.7) * 0.45; keyHolder.position.y = Math.sin(t * 1.3) * 0.02; keyHolder.rotation.z = 0.18;
  if (canTake) { keyCenter.set(0, 0, 0); keyHolder.localToWorld(keyCenter); const s = room.toScreen(keyCenter); hit.style.transform = `translate(${s.x}px,${s.y}px)`; }
  if (key.userData.halo) key.userData.halo.material.opacity = 0.3 + Math.sin(t * 2) * 0.08;
});

function play() {
  if (tl) tl.kill();
  canTake = false; hit.style.display = 'none';
  P.hideBig(); P.hint('');
  room.resetLights(); order.fill(ALTAR_ORDER, { lit: true }); room.setPaintingLight(0.42); room.setPaintingOpen(false);
  tray.setAll([]); tray.show(true);
  room.setPads({ top: P.isMobile() ? 64 : 76, bottom: tray.height() + 10 }); P.setHintBottom(tray.height() + 18);
  room.setFocus('painting', 0);
  GL.ctx.clearRect(0, 0, GL.canvas.width, GL.canvas.height); GL.tex.needsUpdate = true; GL.mat.opacity = 0;
  // the fused crystal, floating where the puzzle left it
  const C = room.clusterCenter.clone(), g = crystal.group;
  crystal.assemble(); room.scene.add(g); g.visible = true; g.position.copy(C); g.rotation.set(0, 0, 0); g.scale.setScalar(PUZZLE_SCALE); crystal.setCrackGlow(0.35);
  key.visible = false; key.scale.setScalar(0.001);
  const target = new THREE.Vector3(PAINT.cx, PAINT.cy, WALL_Z + 0.14);
  FX.light.flash.position.copy(target); FX.light.glow.position.copy(C); FX.light.light.position.copy(C);
  tl = gsap.timeline({ delay: 0.4 });
  tl.to(crystal.materials.crack, { emissiveIntensity: 3, duration: 0.6, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 0)
    .fromTo(FX.light.light, { intensity: 0 }, { intensity: 2, duration: 0.6 }, 0)
    .to(g.position, { x: target.x, y: target.y, z: target.z, duration: 1.1, ease: 'power2.inOut' }, 1.0)
    .to(g.rotation, { y: Math.PI * 2, duration: 1.1, ease: 'power2.inOut' }, 1.0)
    .to(g.scale, { x: 0.3, y: 0.3, z: 0.3, duration: 1.1, ease: 'power2.inOut' }, 1.0)
    .to(FX.light.light.position, { x: target.x, y: target.y, z: target.z + 0.2, duration: 1.1, ease: 'power2.inOut' }, 1.0)
    .call(() => { frameGlow(); room.shake(0.025, 0.4); }, null, 2.1)
    .set(g, { visible: false }, 2.15)
    .fromTo(FX.light.flash.material, { opacity: 0 }, { opacity: 0.7, duration: 0.1 }, 2.1)
    .to(FX.light.flash.material, { opacity: 0, duration: 0.8 }, 2.2)
    .fromTo(GL.mat, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 2.1)
    .to(GL.mat, { opacity: 0, duration: 0.9 }, 2.6)
    .to(FX.light.light, { intensity: 0, duration: 0.8 }, 2.3)
    .call(() => room.setFocus('niche', 1.8), null, 2.6);
  room.flare(tl, 2.1);
  room.openPainting(tl, 2.7, 1.7);
  tl.set(key, { visible: true }, 3.3)
    .to(key.scale, { x: 0.52, y: 0.52, z: 0.52, duration: 0.9, ease: 'back.out(1.6)' }, 3.3)
    .call(() => { canTake = true; hit.style.display = ''; P.hint(TEXT.hintTakeKey); }, null, 4.1);
}
function take() {
  if (!canTake) return; canTake = false; hit.style.display = 'none';
  keyCenter.set(0, 0, 0); keyHolder.localToWorld(keyCenter); const from = room.toScreen(keyCenter);
  sparks(P.ui, from.x, from.y, 18, 80);
  gsap.timeline()
    .to(key.scale, { x: 0.001, y: 0.001, z: 0.001, duration: 0.35, ease: 'power2.in' }, 0)
    .to(room.niche.light, { intensity: 0.9, duration: 1 }, 0)
    .to(room.niche.glow.material, { opacity: 0.22, duration: 1 }, 0)
    .add(flyIcon(P.ui, keyIcon, from, tray.center('key'), { dur: 0.75, size: 90, lift: 60, onComplete: () => { tray.set('key', true); tray.flash('key'); P.hint(TEXT.hintBox); } }), 0.15);
}
hit.onclick = take;
P.onReplay(play);
P.onView(() => setTimeout(play, 30));
await room.need('crystal'); // the fused crystal is on screen from the start (loading screen until it's ready)
play();
window.__p17 = { room, take, get tl() { return tl; } };
</script>
</body>
</html>
