<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10 El Cuarto del Cholo · Los objetos del Cholo</title>
<link rel="stylesheet" href="lib/cholo.css">
<script src="lib/vendor.js"></script>
<link rel="stylesheet" href="lib/reward-stage.css">
<link rel="stylesheet" href="lib/room.css">
</head>
<body>
<script type="module">
import { roomPage, select } from './lib/room-page.js';
import { createRoom } from './lib/room.js';
import { createTray } from './lib/tray.js';
import { createAltarOrder } from './lib/altar-order.js';
import { createClue } from './lib/notebook-clue.js';
import { createCrystal } from './lib/crystal.js';
import { createShadowPuzzle } from './lib/shadow-puzzle.js';
import { playRiseShatter } from './lib/crystal-fx.js';
import { TEXT, ALTAR_ORDER } from './lib/level2-text.js';

let state = Math.min(4, Math.max(0, +(new URLSearchParams(location.search).get('estado') || 1) - 1));
const pick = select(TEXT.state, TEXT.roomStates.map((s, i) => `${i + 1} · ${s}`), state, v => { state = v; apply(); });
// demo: force High / Low / Minima quality (auto shows the level it is on)
const Q_MODES = ['auto', 'high', 'low', 'minimal'];
const qPick = select(TEXT.quality, TEXT.qualityModes, 0, v => room.quality.set(Q_MODES[v]));
const P = roomPage({ page: '10', controls: [pick, qPick] });
const room = createRoom({ stage: P.stage, canvas: P.canvas });
const qLabel = q => { qPick.options[0].text = `${TEXT.qualityModes[0]} (${TEXT.qualityLevels[q.level]})`; const i = Q_MODES.indexOf(q.mode); qPick.value = i; [...qPick.options].forEach((o, k) => o.toggleAttribute('selected', k === i)); };
room.quality.onChange(qLabel); qLabel(room.quality);
const crystal = createCrystal();
let clue, order, seq = null;
const tray = createTray({ mount: P.ui, onRead: () => clue.open() });
clue = createClue({ mount: P.ui });
order = createAltarOrder({ room, page: P, tray, clue, onSolved: () => {
  tray.hide(); room.setPads({ bottom: 40 });
  seq = playRiseShatter(room, crystal, P);
  seq.call(() => { state = 2; pick.value = 2; apply({ keepBig: true }); }, null, '+=0.6');
} });
const puzzle = createShadowPuzzle({ room, crystal, page: P, variant: 'lunas', onSolved: () => P.hint('') });
puzzle.hide();

function apply({ keepBig = false } = {}) {
  if (seq && !keepBig) seq.kill(); seq = null;
  if (!keepBig) P.hideBig();
  order.enable(false); puzzle.hide(); clue.close();
  room.resetLights(); room.setVoid(0, 0); room.setPaintingOpen(false);
  const pads = b => room.setPads({ top: P.isMobile() ? 64 : 76, bottom: b });
  if (state === 0) {
    tray.hide(true); room.clearObjects(); room.setPaintingLight(0.06); pads(40); room.setFocus('full');
    P.hint(TEXT.hintGather);
  } else if (state === 1) {
    order.reset(); tray.show(); pads(tray.height() + 10); P.setHintBottom(tray.height() + 18);
    room.setPaintingLight(0.08); room.setFocus('altar'); order.enable(true);
    P.hint(P.isMobile() ? TEXT.hintPlaceTap : TEXT.hintPlace);
    return;
  } else {
    tray.hide(true); order.fill(ALTAR_ORDER, { lit: true }); pads(40);
    if (state === 2) { room.setPaintingLight(0.22); room.setVoid(1); room.setFocus('painting'); P.hint(TEXT.hintFragments, { delay: keepBig ? 2.5 : 0 }); }
    if (state === 3) { room.setPaintingLight(0.4); room.setFocus('painting'); puzzle.start(); }
    if (state === 4) { room.setPaintingLight(0.4); room.setPaintingOpen(true); room.setFocus('niche'); P.hint(TEXT.hintBox); }
  }
  P.setHintBottom(34);
}
P.onReplay(() => apply());
P.onView(() => setTimeout(() => apply(), 30));
await room.ready;
apply();
window.__room = { room, order, puzzle, crystal, apply, P };
</script>
</body>
</html>
