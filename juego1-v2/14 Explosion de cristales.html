<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>14 Explosión de cristales · Los objetos del Cholo</title>
<link rel="stylesheet" href="lib/cholo.css">
<script src="lib/vendor.js"></script>
<link rel="stylesheet" href="lib/reward-stage.css">
<link rel="stylesheet" href="lib/room.css">
</head>
<body>
<script type="module">
import { roomPage } from './lib/room-page.js';
import { createRoom } from './lib/room.js';
import { createTray } from './lib/tray.js';
import { createAltarOrder } from './lib/altar-order.js';
import { createCrystal } from './lib/crystal.js';
import { playRiseShatter } from './lib/crystal-fx.js';
import { ALTAR_ORDER } from './lib/level2-text.js';

const P = roomPage({ page: '14' });
const room = createRoom({ stage: P.stage, canvas: P.canvas });
const tray = createTray({ mount: P.ui }); tray.hide(true);
const order = createAltarOrder({ room, page: P, tray });
const crystal = createCrystal(); crystal.group.visible = false;
let tl = null;

function play() {
  if (tl) tl.kill();
  P.hideBig(); P.hint('');
  room.resetLights(); order.fill(ALTAR_ORDER, { lit: true }); room.setPaintingLight(0.12);
  room.setPads({ top: P.isMobile() ? 64 : 76, bottom: 40 }); room.setFocus('altar', 0);
  tl = gsap.timeline({ delay: 0.5 });
  room.flare(tl, 0);
  tl.add(playRiseShatter(room, crystal, P), 0.3);
  if (new URLSearchParams(location.search).has('final')) tl.progress(1);
}
P.onReplay(play);
P.onView(() => setTimeout(play, 30));
await room.need('crystal'); // the sequence nests the crystal's timeline: wait for its stage (loading screen meanwhile)
play();
</script>
</body>
</html>
