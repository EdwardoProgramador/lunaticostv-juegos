<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 HUD · Los objetos del Cholo</title>
<link rel="stylesheet" href="lib/cholo.css">
<script src="lib/vendor.js"></script>
<style>
  .wrap{padding:28px;display:flex;flex-direction:column;gap:28px}
  .stage-shell{display:flex;justify-content:center}
  .stage{position:relative;width:100%;height:520px;background:var(--c-bg);border:1px solid rgba(184,121,106,.22);overflow:hidden}
  .stage.is-mobile{width:390px;height:760px;border-radius:28px;border:8px solid #15121b;box-shadow:0 0 0 1px rgba(184,121,106,.3)}
  .mock{position:absolute;inset:0;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
  .mock-nav{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid rgba(242,210,188,.08)}
  .mock-nav .logo{font-family:var(--f-title);font-size:24px;color:#B8796A}
  .bar{height:12px;background:rgba(242,210,188,.07)}
  .mock h2{margin:30px 0 6px;font-size:clamp(44px,8vw,80px)}
  .states{display:flex;flex-wrap:wrap;gap:22px}
  .states figure{margin:0;display:flex;flex-direction:column;gap:10px}
  .states figcaption{font:600 12px/1 var(--f-ui);letter-spacing:.2em;color:#8C7F8E;text-transform:uppercase}
  .note{margin:0;color:#b9aab4;font:400 16px/1.45 var(--f-ui);max-width:70ch}
</style>
</head>
<body>
<div class="ch-page">
  <header class="ch-head">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="ch-label">06 · HUD de colección</span>
      <h1 class="ch-title" data-text="HUD" style="font-size:56px">HUD</h1>
    </div>
    <div class="ch-row">
      <button class="ch-btn ch-btn--sm" id="next">Recolectar siguiente</button>
      <button class="ch-btn ch-btn--sm ch-btn--ghost" id="replay">Repetir</button>
      <button class="ch-btn ch-btn--sm ch-btn--ghost" id="reset">Reiniciar</button>
      <div class="seg" role="group" aria-label="Vista">
        <button aria-pressed="true" data-v="desk">Escritorio</button>
        <button aria-pressed="false" data-v="mob">Móvil</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="stage-shell">
      <div class="stage" id="stage">
        <div class="mock" aria-hidden="true">
          <div class="mock-nav"><span class="logo">LunaticosTv</span><div class="ch-row"><div class="bar" style="width:48px"></div><div class="bar" style="width:48px"></div><div class="bar" style="width:48px"></div></div></div>
          <h2 class="ch-title" data-text="Cholo">Cholo</h2>
          <div class="bar" style="width:70%"></div><div class="bar" style="width:62%"></div><div class="bar" style="width:40%"></div>
        </div>
      </div>
    </div>
    <p class="note">Oculto por defecto. Al recolectar un objeto entra por arriba a la derecha (arriba al centro en móvil), la casilla nueva parpadea como señal con interferencia y queda a color. Sale sola a los 3 segundos.</p>
    <section>
      <div class="ch-label" style="margin-bottom:14px">Estados</div>
      <div class="states" id="states"></div>
    </section>
  </main>
</div>
<script type="module">
import { createHUD } from './lib/hud.js';
import { keepGsapAlive } from './lib/loop.js';
keepGsapAlive();
const stage = document.getElementById('stage');
let hud = createHUD({ mount: stage, mode: 'absolute' });
const statesEl = document.getElementById('states');
for (let n = 0; n <= 5; n++) {
  const f = document.createElement('figure');
  f.innerHTML = `<figcaption>${n}/5</figcaption>`;
  statesEl.appendChild(f);
  createHUD({ mount: f, mode: 'static', collected: [0, 1, 2, 3, 4].slice(0, n) });
}
document.getElementById('next').onclick = () => { if (hud.next() < 0) { hud.reset(); hud.next(); } };
document.getElementById('replay').onclick = () => hud.replay();
document.getElementById('reset').onclick = () => hud.reset();
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  const keep = hud.collected.map((v, i) => v ? i : -1).filter(i => i >= 0);
  stage.classList.toggle('is-mobile', b.dataset.v === 'mob');
  hud.el.remove(); hud = createHUD({ mount: stage, mode: 'absolute', collected: keep });
});
setTimeout(() => hud.collect(0), 600);
</script>
</body>
</html>
