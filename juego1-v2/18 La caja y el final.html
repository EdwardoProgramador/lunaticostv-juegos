<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>18 La caja y el final · Los objetos del Cholo</title>
<link rel="stylesheet" href="lib/cholo.css">
<script src="lib/vendor.js"></script>
<link rel="stylesheet" href="lib/reward-stage.css">
<link rel="stylesheet" href="lib/room.css">
</head>
<body>
<script type="module">
import { roomPage } from './lib/room-page.js';
import { createChest, createReveal } from './lib/chest.js';
import { createTray } from './lib/tray.js';
import { buildKey, renderIcon } from './lib/key.js';
import { texturesReady } from './lib/cholo-objects.js';
import { TEXT } from './lib/level2-text.js';

const toggle = document.createElement('button'); toggle.className = 'ch-btn ch-btn--sm ch-btn--ghost'; toggle.setAttribute('aria-pressed', 'false');
const P = roomPage({ page: '18', room: false, controls: [toggle] });
const stage = P.stage;
const keyIcon = renderIcon(buildKey(), 160);
const tray = createTray({ mount: stage, items: [{ key: 'key', name: TEXT.keyName, src: keyIcon, sil: keyIcon }], label: TEXT.inventoryLabel });
tray.slots.key.querySelector('.chud-sil').style.filter = 'brightness(0) opacity(.35)';
const box = createChest({ mount: stage });
const reveal = createReveal({ mount: stage });
let hasKey = false;
function setKey(v) {
  hasKey = v; toggle.setAttribute('aria-pressed', v); toggle.textContent = (v ? '✓ ' : '') + TEXT.haveKey;
  toggle.classList.toggle('ch-btn--ghost', !v);
  tray.set('key', v); v ? tray.show() : tray.hide();
}
toggle.onclick = () => { reset(); setKey(!hasKey); };
// the box: small, just below the right end of the header — never over its buttons
function place() {
  const h = P.site.el, mob = stage.clientWidth <= 640;
  box.el.style.top = (h.offsetTop + h.offsetHeight + 6) + 'px';
  box.el.style.right = (mob ? 4 : 14) + 'px';
}
new ResizeObserver(place).observe(stage); place();
box.hit.onclick = () => {
  if (box.busy || box.open) return;
  if (!hasKey) return box.shake();
  tray.set('key', false);
  box.unlock({ from: tray.center('key'), keySrc: keyIcon, onOpen: () => { tray.hide(); reveal.show(); } });
};
function reset() { box.reset(); reveal.reset(); }
P.onReplay(() => { reset(); setKey(hasKey); if (hasKey) setTimeout(() => box.hit.click(), 700); else setTimeout(() => box.shake(), 500); });
P.onView(() => setTimeout(place, 30));
await texturesReady();
setKey(new URLSearchParams(location.search).has('llave'));
</script>
</body>
</html>
