<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>15 HUD de fragmentos · Los objetos del Cholo</title>
<link rel="stylesheet" href="lib/cholo.css">
<script src="lib/vendor.js"></script>
<link rel="stylesheet" href="lib/reward-stage.css">
<link rel="stylesheet" href="lib/room.css">
<style>
  .c15-extra{padding:4px 24px 40px;display:flex;flex-direction:column;gap:22px}
  .c15-states{display:flex;flex-wrap:wrap;gap:26px}
  .c15-states figure{margin:0;display:flex;flex-direction:column;gap:14px}
  .c15-states figcaption{font:600 12px/1 var(--f-ui);letter-spacing:.2em;color:#8C7F8E;text-transform:uppercase}
  .c15-note{margin:0;color:#b9aab4;font:400 16px/1.45 var(--f-ui);max-width:70ch}
  .stage{height:min(560px,calc(100vh - 130px))}
</style>
</head>
<body>
<script type="module">
import { roomPage, button } from './lib/room-page.js';
import { createFragmentHUD } from './lib/fragment-hud.js';
import { createHUD } from './lib/hud.js';
import { TEXT } from './lib/level2-text.js';

let hud;
const P = roomPage({ page: '15', room: false, controls: [button(TEXT.demo.reset, () => hud.reset()), button(TEXT.demo.next, () => { if (hud.next() < 0) { hud.reset(); hud.next(); } }, false)] });
const mount = () => { const keep = hud ? hud.collected.map((v, i) => v ? i : -1).filter(i => i >= 0) : []; if (hud) hud.el.remove(); hud = createFragmentHUD({ mount: P.stage, mode: 'absolute', collected: keep }); };
mount();
P.onReplay(() => { if (hud.collected.every(v => !v)) hud.next(); else hud.replay(); });
P.onView(() => mount());

const extra = document.createElement('section'); extra.className = 'c15-extra';
extra.innerHTML = `<p class="c15-note">${TEXT.notes[15]}</p><div class="ch-label">${TEXT.states}</div><div class="c15-states"></div>`;
P.wrap.appendChild(extra);
const row = extra.querySelector('.c15-states');
for (let n = 0; n <= 5; n++) {
  const f = document.createElement('figure'); f.innerHTML = `<figcaption>${n}/5</figcaption>`; row.appendChild(f);
  createFragmentHUD({ mount: f, mode: 'static', collected: [0, 1, 2, 3, 4].slice(0, n) });
}
// for comparison: the objects HUD (level 1)
const cmp = document.createElement('figure'); cmp.innerHTML = `<figcaption>${TEXT.trayLabel} · 5/5</figcaption>`; row.appendChild(cmp);
createHUD({ mount: cmp, mode: 'static', collected: [0, 1, 2, 3, 4] });
setTimeout(() => hud.collect(0), 600);
setTimeout(() => hud.collect(1), 1900);
</script>
</body>
</html>
