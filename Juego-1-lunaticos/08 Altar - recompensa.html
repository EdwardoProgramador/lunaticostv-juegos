<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>08 Altar - recompensa · Los objetos del Cholo</title>
<link rel="stylesheet" href="lib/cholo.css">
<script src="lib/vendor.js"></script>
<link rel="stylesheet" href="lib/reward-stage.css">
</head>
<body>
<div class="ch-page">
  <header class="ch-head">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="ch-label">08 · Altar — recompensa · 5/5 objetos</span>
    </div>
    <div class="ch-row">
      <button class="ch-btn ch-btn--sm" id="replay">Repetir</button>
      <div class="seg" role="group" aria-label="Vista">
        <button aria-pressed="true" data-v="desk">Escritorio</button>
        <button aria-pressed="false" data-v="mob">Móvil</button>
      </div>
    </div>
  </header>
  <div class="shell">
    <div class="stage" id="stage">
      <div class="mock" aria-hidden="true">
        <div class="row"><span class="logo">LunaticosTv</span><div class="ch-row"><div class="bar" style="width:48px"></div><div class="bar" style="width:48px"></div><div class="bar" style="width:48px"></div></div></div>
        <div class="bar" style="width:46%;height:40px;margin-top:30px"></div>
        <div class="bar" style="width:64%"></div><div class="bar" style="width:52%"></div>
        <div class="block"></div>
      </div>
      <div class="dim" id="dim"></div>
      <canvas id="gl"></canvas>
      <div class="final"><h1 class="ch-title" id="title" data-text="Conseguiste los objetos del Cholo">Conseguiste los objetos del Cholo</h1></div>
      <div class="cta" id="cta"><button class="ch-btn">Ver contenido exclusivo</button></div>
    </div>
  </div>
</div>
<script type="module">
import { createAltarScene, texturesReady } from './lib/altar-scene.js';

const $ = id => document.getElementById(id);
const stage = $('stage');
if (matchMedia('(max-width:640px)').matches) { stage.classList.add('is-mobile'); document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === 'mob')); }
const altar = createAltarScene({ stage, canvas: $('gl'), title: $('title'), cta: $('cta'), dim: $('dim') });
function play() {
  const tl = altar.play();
  if (new URLSearchParams(location.search).has('final')) tl.progress(1);
}
$('replay').onclick = play;
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  stage.classList.toggle('is-mobile', b.dataset.v === 'mob'); altar.frame(); play();
});
await texturesReady();
play();
</script>
</body>
</html>
